<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxen — AI Voice Sales Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07090e;
            --bg-card: #0f1422;
            --bg-subtle: #141b2d;
            --bg-input: #090c16;
            --accent-primary: #38bdf8;
            --accent-primary-hover: #7dd3fc;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --accent-subtle: rgba(56, 189, 248, 0.12);
            --accent-border: rgba(56, 189, 248, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-heading: #ffffff;
            --danger-bg: rgba(239, 68, 68, 0.14);
            --danger-border: rgba(239, 68, 68, 0.35);
            --danger-text: #fca5a5;
            --danger-hover: rgba(239, 68, 68, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 80% 40% at 50% -10%, rgba(56, 189, 248, 0.18), transparent 70%),
                radial-gradient(circle at 10% 90%, rgba(14, 165, 233, 0.08), transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--bg-card);
            padding: 32px 28px;
            border-radius: 20px;
            border: 1px solid var(--accent-border);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.75),
                0 0 40px -10px var(--accent-glow);
            width: 100%;
            max-width: 520px;
            backdrop-filter: blur(16px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-primary);
            background: var(--accent-subtle);
            border: 1px solid var(--accent-border);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .brand-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-primary);
            box-shadow: 0 0 8px var(--accent-primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        h1 {
            color: var(--text-heading);
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h1 .brand-name {
            background: linear-gradient(135deg, #ffffff 10%, #7dd3fc 60%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 500;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--accent-border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text-main);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            border-color: var(--accent-primary);
            background-color: #0c111e;
            box-shadow: 0 0 0 3px var(--accent-glow);
            outline: none;
        }

        .controls {
            text-align: center;
            margin: 22px 0 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        button {
            font-family: inherit;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: #03111d;
            font-weight: 600;
            padding: 11px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 0;
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }

        button:hover {
            background: linear-gradient(135deg, #38bdf8, #7dd3fc);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        #simulateBtn {
            background: var(--accent-subtle);
            color: var(--accent-primary);
            border: 1px solid var(--accent-border);
            box-shadow: none;
        }

        #simulateBtn:hover:not(:disabled) {
            background: rgba(56, 189, 248, 0.22);
            border-color: var(--accent-primary);
            color: #ffffff;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        #endBtn {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
            box-shadow: none;
        }

        #endBtn:hover:not(:disabled) {
            background: var(--danger-hover);
            border-color: #ef4444;
            color: #ffffff;
        }

        button:disabled {
            background: #151b2a !important;
            color: #475569 !important;
            border: 1px solid #1e293b !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none !important;
        }

        .mode-selector {
            margin: 20px 0;
            padding: 16px;
            background-color: var(--bg-subtle);
            border-radius: 12px;
            border: 1px solid var(--accent-border);
        }

        .mode-selector h4 {
            margin: 0 0 12px 0;
            color: var(--accent-primary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .mode-options {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .mode-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-option input[type="radio"] {
            width: auto;
            margin: 0;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .mode-option label {
            margin: 0;
            font-weight: 400;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
        }

        #status {
            text-align: center;
            padding: 10px 14px;
            margin: 14px 0;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        #status:empty {
            display: none;
            margin: 0;
            padding: 0;
        }

        .chatbox {
            margin-top: 22px;
            border: 1px solid var(--accent-border);
            border-radius: 14px;
            background: var(--bg-subtle);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(9, 12, 22, 0.6);
            border-bottom: 1px solid var(--accent-border);
        }

        .chat-header h3 {
            margin: 0;
            color: var(--text-heading);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-btn {
            background-color: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
            padding: 5px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            box-shadow: none;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background-color: var(--danger-hover);
            border-color: #ef4444;
            color: #ffffff;
            transform: none;
            box-shadow: none;
        }

        .chat-messages {
            max-height: 280px;
            overflow-y: auto;
            padding: 18px 16px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--bg-card);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        .message {
            margin-bottom: 0;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 82%;
            word-wrap: break-word;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .agent {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.18), rgba(56, 189, 248, 0.12));
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #e0f2fe;
            text-align: left;
            margin-right: auto;
            border-bottom-left-radius: 3px;
        }

        .customer {
            background: #1e293b;
            border: 1px solid rgba(148, 163, 184, 0.25);
            color: #f8fafc;
            text-align: left;
            margin-left: auto;
            border-bottom-right-radius: 3px;
        }

        .message strong {
            display: block;
            font-size: 11px;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .agent strong {
            color: var(--accent-primary);
        }

        .customer strong {
            color: #94a3b8;
        }

        .chat-input-area {
            display: flex;
            padding: 14px 16px;
            border-top: 1px solid var(--accent-border);
            background: rgba(9, 12, 22, 0.7);
            gap: 10px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 11px 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--accent-border);
            border-radius: 24px;
            outline: none;
            font-size: 13.5px;
            color: var(--text-main);
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .send-btn {
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: #03111d;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            padding: 0;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #38bdf8, #7dd3fc);
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.55);
            transform: scale(1.05);
        }

        .conversation {
            margin-top: 20px;
            padding: 16px;
            background-color: var(--bg-subtle);
            border: 1px solid var(--accent-border);
            border-radius: 12px;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }

        .footer-credit {
            margin-top: 24px;
            text-align: center;
            font-size: 11.5px;
            color: #64748b;
            letter-spacing: 0.3px;
        }

        .footer-credit a, .footer-credit span.author {
            color: var(--accent-primary);
            font-weight: 500;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            body {
                padding: 16px 12px;
            }
            .container {
                padding: 22px 18px;
            }
            .mode-options {
                flex-direction: column;
                gap: 10px;
            }
            .controls {
                flex-direction: column;
            }
            button {
                width: 100%;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <div class="brand-badge">Autonomous Voice AI</div>
            <h1>🎙️ <span class="brand-name">Voxen</span></h1>
            <p class="subtitle">AI-Powered Conversational Sales Agent</p>
        </div>
        
        <div class="form-group">
            <label for="customerName">Customer Name:</label>
            <input type="text" id="customerName" placeholder="Enter customer name" value="John Doe">
        </div>
        
        <div class="form-group">
            <label for="phoneNumber">Phone Number:</label>
            <input type="text" id="phoneNumber" placeholder="Enter phone number" value="+1234567890">
        </div>
        
        <div class="controls">
            <button onclick="startCall()">📞 Start Call</button>
            <button onclick="simulateResponse()" id="simulateBtn" disabled>🎙️ Simulate Voice Response</button>
            <button onclick="endCall()" id="endBtn" disabled>📴 End Call</button>
        </div>
        
        <div id="modeSelector" class="mode-selector" style="display: none;">
            <h4>🤖 AI Response Mode</h4>
            <div class="mode-options">
                <div class="mode-option">
                    <input type="radio" id="customMode" name="responseMode" value="custom" checked>
                    <label for="customMode">📝 Custom Sales Responses (Rule-based)</label>
                </div>
                <div class="mode-option">
                    <input type="radio" id="ragMode" name="responseMode" value="rag">
                    <label for="ragMode">🧠 RAG System (AI Knowledge Base)</label>
                </div>
            </div>
        </div>
        
        <div id="status"></div>
        
        <div id="chatbox" class="chatbox" style="display: none;">
            <div class="chat-header">
                <h3>💬 Live Call Interaction</h3>
                <button onclick="clearChatHistory()" class="clear-btn">🗑️ Clear History</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Type your response here..." disabled>
                <button onclick="sendChatMessage()" id="sendBtn" class="send-btn" disabled>📤</button>
            </div>
        </div>
        
        <div id="conversation" class="conversation" style="display: none;">
            <h3>📋 Conversation History</h3>
            <div id="messages"></div>
        </div>

        <div class="footer-credit">
            Voxen AI • Created by <span class="author">Bhavishya</span>
        </div>
    </div>

    <script>
        let currentCallId = null;
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.backgroundColor = type === 'error' ? '#ffebee' : '#e8f5e8';
            status.style.color = type === 'error' ? '#c62828' : '#2e7d32';
        }
        
        async function startCall() {
            const customerName = document.getElementById('customerName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            
            if (!customerName || !phoneNumber) {
                updateStatus('Please enter customer name and phone number', 'error');
                return;
            }
            
            try {
                const response = await fetch('/start-call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        customer_name: customerName,
                        phone_number: phoneNumber
                    })
                });
                
                const data = await response.json();
                currentCallId = data.call_id;
                
                updateStatus(`Call started with ${customerName}`);
                document.getElementById('simulateBtn').disabled = false;
                document.getElementById('endBtn').disabled = false;
                document.getElementById('chatInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('modeSelector').style.display = 'block';
                document.getElementById('chatbox').style.display = 'block';
                
                addChatMessage('agent', data.first_message);
                
            } catch (error) {
                updateStatus('Error starting call: ' + error.message, 'error');
            }
        }
        
        async function simulateResponse() {
            if (!currentCallId) return;
            
            const customerInput = prompt('Simulate customer speech input:');
            if (!customerInput) {
                updateStatus('No input provided');
                return;
            }
            
            updateStatus('Processing simulated voice input...');
            
            try {
                const selectedMode = document.querySelector('input[name="responseMode"]:checked').value;
                const endpoint = selectedMode === 'rag' 
                    ? `/rag-respond/${currentCallId}` 
                    : `/respond/${currentCallId}`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: customerInput
                    })
                });
                
                const data = await response.json();
                
                addChatMessage('customer', customerInput);
                addChatMessage('agent', data.reply);
                
                if (data.should_end_call) {
                    endCall();
                }
                
                updateStatus(`Voice response processed (${selectedMode === 'rag' ? 'RAG' : 'Custom'} mode)`);
                
            } catch (error) {
                updateStatus('Error processing voice: ' + error.message, 'error');
            }
        }
        
        async function sendChatMessage() {
            if (!currentCallId) return;
            
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            if (!message) return;
            
            const selectedMode = document.querySelector('input[name="responseMode"]:checked').value;
            
            chatInput.value = '';
            chatInput.disabled = true;
            document.getElementById('sendBtn').disabled = true;
            
            try {
                addChatMessage('customer', message);
                
                const endpoint = selectedMode === 'rag' 
                    ? `/rag-respond/${currentCallId}` 
                    : `/respond/${currentCallId}`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });
                
                const data = await response.json();
                
                addChatMessage('agent', data.reply);
                
                if (data.should_end_call) {
                    endCall();
                } else {
                    chatInput.disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    chatInput.focus();
                }
                
                updateStatus(`Response processed (${selectedMode === 'rag' ? 'RAG' : 'Custom'} mode)`);
                
            } catch (error) {
                updateStatus('Error sending response: ' + error.message, 'error');
                chatInput.disabled = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }
        
        function endCall() {
            updateStatus('Call ended - Ready to start a new call');
            
            document.getElementById('simulateBtn').disabled = true;
            document.getElementById('endBtn').disabled = true;
            document.getElementById('chatInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('modeSelector').style.display = 'none';
            document.getElementById('chatbox').style.display = 'none';
            
            currentCallId = null;
        }
        
        function addChatMessage(sender, text) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<strong>${sender === 'agent' ? '🤖 Agent' : '👤 You'}:</strong> ${text}`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function clearChatHistory() {
            const chatMessages = document.getElementById('chatMessages');
            
            if (confirm('Are you sure you want to clear the chat history?')) {
                chatMessages.innerHTML = '';
                updateStatus('Chat history cleared');
            }
        }
        
        async function checkRagStatus() {
            try {
                const response = await fetch('/rag-status');
                const status = await response.json();
                
                const ragOption = document.getElementById('ragMode');
                const ragLabel = document.querySelector('label[for="ragMode"]');
                
                if (!status.available) {
                    ragOption.disabled = true;
                    ragLabel.style.color = '#999';
                    ragLabel.title = status.message;
                    document.getElementById('customMode').checked = true;
                } else {
                    ragOption.disabled = false;
                    ragLabel.style.color = '';
                    ragLabel.title = 'RAG system ready';
                }
                
                updateStatus(`RAG Status: ${status.message}`, status.available ? 'info' : 'error');
            } catch (error) {
                console.error('Failed to check RAG status:', error);
                const ragOption = document.getElementById('ragMode');
                if (ragOption) {
                    ragOption.disabled = true;
                    document.getElementById('customMode').checked = true;
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const chatInput = document.getElementById('chatInput');
            if (chatInput) {
                chatInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter' && !chatInput.disabled) {
                        sendChatMessage();
                    }
                });
            }
            
            checkRagStatus();
        });
    </script>
</body>
</html>
